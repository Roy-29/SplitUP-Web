<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient: Modern Deep Indigo to Royal Navy -->
    <linearGradient id="splitup-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>

    <!-- Top Ribbon: Crisp White to Mint Cyan (Up & Growth) -->
    <linearGradient id="splitup-top" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>

    <!-- Bottom Ribbon: Emerald 500 to Electric Sky (Expense Splitting Balance) -->
    <linearGradient id="splitup-bottom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Subtle Inner Glow / Elevation Filter -->
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer Rounded Fintech Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#splitup-bg)" stroke="rgba(255,255,255,0.22)" stroke-width="1.5"/>

  <!-- Upper Segment (S Curve & Upward trajectory) -->
  <path d="M 16 26 C 16 18 22.5 12 32.5 12 C 42 12 48 18 48 24.5 C 48 28.5 45 30.5 39 32.3 L 22 37.2" stroke="url(#splitup-top)" stroke-width="5.5" stroke-linecap="round"/>

  <!-- Lower Segment (Shared Split balance) -->
  <path d="M 48 38 C 48 46 41.5 52 31.5 52 C 22 52 16 46 16 39.5 C 16 35.5 19 33.5 25 31.7 L 42 26.8" stroke="url(#splitup-bottom)" stroke-width="5.5" stroke-linecap="round"/>

  <!-- Central Division Node -->
  <circle cx="32" cy="32" r="3" fill="#ffffff" filter="url(#softGlow)"/>
</svg>